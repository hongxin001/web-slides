<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<!--__HEAD__-->
<style>
/* ---------- runtime defaults (a deck's deck.css overrides these) ---------- */
:root{--orange:#E07A3F;--peach:#F0A06B;--sans:system-ui,"Helvetica Neue",Arial,"PingFang SC",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0b1120;font-family:var(--sans);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;transform:translate(-50%,-50%)}
.slide{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;background:#fff}
.slide.active{display:flex}

/* ========== deck.css ========== */
/*__DECK_CSS__*/
/* ========== runtime: chrome, overview, presenter view, print ========== */
/* ---------- chrome ---------- */
#bar{position:fixed;left:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--orange),var(--peach));transition:width .3s;z-index:20}
#ctl{position:fixed;right:16px;bottom:16px;display:flex;gap:6px;align-items:center;z-index:30;opacity:0;transition:opacity .25s;background:rgba(11,17,32,.78);backdrop-filter:blur(8px);padding:6px 8px;border-radius:12px;color:#fff;font-size:14px}
body.show #ctl,#ctl:hover{opacity:1}
#ctl button{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;font-size:16px}
#ctl button:hover{background:rgba(255,255,255,.16)}
#ctl span{padding:0 6px;font-variant-numeric:tabular-nums;min-width:58px;text-align:center}
#notes{white-space:pre-wrap;position:fixed;left:0;right:0;bottom:0;max-height:30vh;overflow:auto;display:none;background:#0f182c;color:#e9edf3;border-top:2px solid var(--orange);padding:18px 7vw 26px;font-size:18px;line-height:1.55;z-index:10}
#notes::before{content:"SPEAKER NOTES";display:block;font-size:12px;letter-spacing:.16em;color:var(--peach);margin-bottom:6px;font-weight:700}
body.notes #notes{display:block}
#help{position:fixed;left:16px;bottom:16px;z-index:30;color:#aab4c5;font-size:13px;opacity:0;transition:opacity .25s;background:rgba(11,17,32,.78);padding:8px 12px;border-radius:10px}
body.show #help{opacity:1}
kbd{font:600 12px var(--sans);border:1px solid #55617a;border-radius:4px;padding:1px 5px;margin:0 2px;color:#fff}

/* ---------- overview ---------- */
body.overview{overflow:auto}
body.overview #stage{position:static;transform:none!important;width:auto;height:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:28px}
body.overview .slide{position:relative;display:flex;width:1280px;height:720px;zoom:var(--tz,.22);cursor:pointer;box-shadow:none;border-radius:10px;outline:0 solid var(--orange)}
body.overview .slide *{animation:none!important}
body.overview .slide.active{outline-width:10px}
body.overview .slide:hover{outline:10px solid var(--peach)}
body.overview #notes,body.overview #help{display:none}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;max-width:80vw;background:rgba(11,17,32,.92);color:#fff;border:1px solid var(--orange);border-radius:10px;padding:10px 16px;font-size:14px;line-height:1.5;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}

/* ---------- presenter view (?speaker) ---------- */
#sp{display:none}
body.speaker #sp{display:block}
body.speaker #stage{position:static;transform:none!important;width:0;height:0}
body.speaker .slide{position:fixed;inset:auto;width:1280px;height:720px;transform-origin:0 0;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
body.speaker .slide *{animation:none!important}
body.speaker .slide.active{left:var(--cx);top:var(--cy);transform:scale(var(--cz))}
body.speaker .slide.next{display:flex;left:var(--nx);top:var(--cy);transform:scale(var(--nz))}
body.speaker #ctl,body.speaker #help{display:none}
body.speaker #notes{display:block;left:var(--nx);top:var(--nty);right:20px;bottom:20px;max-height:none;border:1px solid #26324d;border-radius:10px;padding:18px 22px;font-size:var(--nf,18px);white-space:pre-wrap}
#sp .lbl{position:fixed;top:16px;font:700 12px/1 var(--sans);letter-spacing:.16em;color:var(--peach)}
#sp .lbl b{color:#e9edf3;margin-left:8px;letter-spacing:.04em}
#spend{position:fixed;z-index:-1;left:var(--nx);top:var(--cy);width:var(--nw);height:var(--nh);border:2px dashed #33415f;border-radius:6px;display:grid;place-items:center;color:#7f8ba3;font-size:16px}
#spinfo{position:fixed;left:var(--cx);top:var(--iy);width:var(--cw);display:flex;align-items:flex-end;gap:36px;color:#e9edf3}
#spinfo small{display:block;font:700 12px/1 var(--sans);letter-spacing:.16em;color:#7f8ba3;margin-bottom:8px}
#spinfo b{font:600 46px/1 var(--sans);font-variant-numeric:tabular-nums}
#spinfo #spc{font-weight:400;color:#aab4c5}
#spinfo .paused{color:var(--peach)}
#spinfo .btns{margin-left:auto;display:flex;gap:8px}
#spinfo button{all:unset;cursor:pointer;font:600 14px/1 var(--sans);padding:10px 14px;border-radius:8px;background:#1a2540;color:#e9edf3}
#spinfo button:hover{background:#26324d}

/* ---------- print: one slide per page ---------- */
@page{size:1280px 720px;margin:0}
@media print{
  html,body{height:auto;overflow:visible;background:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;animation:none!important}
  #stage,body.overview #stage{position:static;display:block;padding:0;transform:none!important;width:1280px;height:auto}
  .slide,body.overview .slide{position:relative;display:flex;width:1280px;height:720px;zoom:1;outline:0;border-radius:0;box-shadow:none;break-after:page;page-break-after:always}
  #bar,#ctl,#notes,#help{display:none!important}
}
</style>
</head>
<body>
<main id="stage">

<!--__SLIDES__-->

</main>

<div id="bar"></div>
<div id="toast"></div>
<aside id="notes"></aside>
<div id="help"><kbd>←</kbd><kbd>→</kbd> navigate · <kbd>N</kbd> notes · <kbd>O</kbd> overview · <kbd>P</kbd> presenter view · <kbd>F</kbd> fullscreen</div>
<div id="sp">
  <span class="lbl" style="left:var(--cx)">CURRENT<b id="spn"></b></span><span class="lbl" style="left:var(--nx)">NEXT</span>
  <div id="spend">End of slides</div>
  <div id="spinfo">
    <div><small>ELAPSED</small><b id="spt">00:00</b></div>
    <div><small>CLOCK</small><b id="spc"></b></div>
    <div class="btns"><button id="sppause" title="Pause / resume timer (T)">Pause</button><button id="spreset" title="Reset timer (R)">Reset</button><button id="spminus" title="Smaller notes (-)">A−</button><button id="spplus" title="Larger notes (+)">A+</button></div>
  </div>
</div>
<nav id="ctl">
  <button id="bp" title="Previous (←)">‹</button><span id="cnt"></span><button id="bn" title="Next (→)">›</button>
  <button id="bo" title="Overview (O)">▦</button><button id="bnn" title="Speaker notes (N)">✎</button><button id="bs" title="Presenter view (P)">▣</button><button id="bf" title="Fullscreen (F)">⤢</button>
</nav>

<script>
const IMG=/*__IMG__*/{};
const NOTES=/*__NOTES__*/[];
document.querySelectorAll('img[data-i]').forEach(e=>e.src=IMG[e.dataset.i]);

const stage=document.getElementById('stage'),slides=[...document.querySelectorAll('.slide')];
const bar=document.getElementById('bar'),cnt=document.getElementById('cnt'),notes=document.getElementById('notes'),B=document.body;
let cur=0;
// presenter view: same file opened with ?speaker, kept in sync with the audience window via postMessage
const CHILD=new URLSearchParams(location.search).has('speaker');
let SP=CHILD,peer=CHILD?window.opener:null;
if(SP){B.classList.add('speaker');document.title='Presenter · '+document.title;}
function send(){try{if(peer&&!peer.closed)peer.postMessage({ws:'go',n:cur},'*');}catch(e){}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),6000);}
// pop-ups unavailable (blocked, or the page runs in a sandboxed iframe): show the presenter layout in this window instead
function inlineSpeaker(on){
  SP=on;B.classList.toggle('speaker',on);B.classList.remove('overview','notes');
  document.getElementById('toast').classList.remove('on');
  if(on){reset();toast(/^zh/i.test(document.documentElement.lang)?'无法弹出独立窗口，已在当前窗口显示演讲者视图（投屏时听众也会看到）。再按 P 或 Esc 退出。':'Pop-ups are unavailable here, so the presenter view is shown in this window (the audience sees it too). Press P or Esc to leave.');}
  go(cur,true);
}
function openSpeaker(){
  if(CHILD)return;
  if(SP)return inlineSpeaker(false);
  if(peer&&!peer.closed){try{peer.focus();return;}catch(e){}}
  let w=null;
  try{w=window.open(location.href.split(/[?#]/)[0]+'?speaker#'+(cur+1),'ws-speaker','width=1280,height=760');}catch(e){}
  if(w)peer=w;else inlineSpeaker(true);
}
addEventListener('message',e=>{const d=e.data;if(!d||d.ws!=='go')return;if(!SP&&e.source)peer=e.source;if(d.n!==cur)go(d.n,true);});
slides.forEach((s,i)=>{const p=s.querySelector('.pg');if(p)p.textContent=i+1;s.addEventListener('click',()=>{if(B.classList.contains('overview')){B.classList.remove('overview');go(i);}});});

function fit(){
  if(SP){
    const W=innerWidth,H=innerHeight,p=20,top=p+22;
    const cz=Math.min((W*.6-p)/1280,(H-top-p-90)/720),nx=p+1280*cz+p;
    const nz=Math.min((W-nx-p)/1280,H*.36/720),st=document.documentElement.style;
    const v={cx:p+'px',cy:top+'px',cz,cw:1280*cz+'px',iy:top+720*cz+18+'px',nx:nx+'px',nz,nw:1280*nz+'px',nh:720*nz+'px',nty:top+720*nz+16+'px'};
    for(const k in v)st.setProperty('--'+k,v[k]);
    return;
  }
  const nh=B.classList.contains('notes')?notes.offsetHeight:0,h=innerHeight-nh;
  const s=Math.min(innerWidth/1280,h/720);
  stage.style.top=h/2+'px';
  stage.style.transform=`translate(-50%,-50%) scale(${s})`;
  document.documentElement.style.setProperty('--tz',(innerWidth-56-60-20)/4/1280);
}
function go(n,quiet){
  cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>{s.classList.toggle('active',i===cur);s.classList.toggle('next',SP&&i===cur+1);});
  bar.style.width=(cur+1)/slides.length*100+'%';
  cnt.textContent=(cur+1)+' / '+slides.length;
  document.getElementById('spn').textContent=cnt.textContent;
  notes.textContent=NOTES[cur]||'';
  history.replaceState(null,'','#'+(cur+1));
  fit();
  if(!quiet)send();
}
function toggle(c){
  if(SP)return;
  B.classList.toggle(c);
  if(c==='overview'){stage.style.top='';if(B.classList.contains('overview'))slides[cur].scrollIntoView({block:'center'});else scrollTo(0,0);}
  fit();
}
function fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}

addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  // e.code fallback: with a Chinese/Japanese IME active, e.key is 'Process' instead of the letter
  const k=/^Key[A-Z]$/.test(e.code)&&!/^[a-z]$/i.test(e.key)?e.code[3].toLowerCase():e.key;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)){e.preventDefault();go(cur+1);}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){e.preventDefault();go(cur-1);}
  else if(k==='Home')go(0);
  else if(k==='End')go(slides.length-1);
  else if(k==='n'||k==='N')toggle('notes');
  else if(k==='o'||k==='O')toggle('overview');
  else if(k==='Escape'&&B.classList.contains('overview'))toggle('overview');
  else if(k==='Escape'&&SP&&!CHILD)inlineSpeaker(false);
  else if(k==='p'||k==='P')openSpeaker();
  else if(SP&&(k==='t'||k==='T'))pause();
  else if(SP&&(k==='r'||k==='R'))reset();
  else if(SP&&(k==='+'||k==='='))nfs(2);
  else if(SP&&k==='-')nfs(-2);
  else if(k==='f'||k==='F')fs();
});
document.getElementById('bp').onclick=()=>go(cur-1);
document.getElementById('bn').onclick=()=>go(cur+1);
document.getElementById('bo').onclick=()=>toggle('overview');
document.getElementById('bnn').onclick=()=>toggle('notes');
document.getElementById('bf').onclick=fs;
document.getElementById('bs').onclick=openSpeaker;

// presenter timer, clock and notes size
let t0=Date.now(),acc=0,run=true,nf=18;
const spt=document.getElementById('spt'),spc=document.getElementById('spc'),pb=document.getElementById('sppause'),p2=n=>String(n).padStart(2,'0');
function tick(){
  const s=Math.floor((acc+(run?Date.now()-t0:0))/1000),d=new Date();
  spt.textContent=(s>=3600?Math.floor(s/3600)+':':'')+p2(Math.floor(s/60)%60)+':'+p2(s%60);
  spc.textContent=p2(d.getHours())+':'+p2(d.getMinutes());
}
function pause(){if(run)acc+=Date.now()-t0;else t0=Date.now();run=!run;pb.textContent=run?'Pause':'Resume';spt.classList.toggle('paused',!run);tick();}
function reset(){acc=0;t0=Date.now();tick();}
function nfs(d){nf=Math.max(14,Math.min(40,nf+d));document.documentElement.style.setProperty('--nf',nf+'px');}
{pb.onclick=pause;document.getElementById('spreset').onclick=reset;document.getElementById('spminus').onclick=()=>nfs(-2);document.getElementById('spplus').onclick=()=>nfs(2);tick();setInterval(tick,500);}

let tx=null;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(tx===null||B.classList.contains('overview'))return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(cur+(d<0?1:-1));tx=null;});
let hideT;
addEventListener('mousemove',()=>{B.classList.add('show');clearTimeout(hideT);hideT=setTimeout(()=>B.classList.remove('show'),2200);});
addEventListener('resize',fit);
addEventListener('hashchange',()=>go((parseInt(location.hash.slice(1))||1)-1));
go((parseInt(location.hash.slice(1))||1)-1);
</script>
</body>
</html>
